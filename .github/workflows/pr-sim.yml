name: sim-before-after

# For PRs to micropython: render before/after GIFs of the display screens with
# the host simulator (sim/before_after.py) and publish them as a build
# artifact and as per-run assets of a hidden prerelease (names carry the run
# id, so uploads never clobber and no previous version is ever lost).
# Nothing is committed to git.

on:
  pull_request:
    branches: [micropython]
    paths: [main.py, src/**, sim/**, tests/**]

permissions:
  contents: write      # release assets (inline GIFs in the PR comment)
  issues: write
  pull-requests: write

jobs:
  gifs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need the base sha for `git show <base>:main.py`

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: unit tests (rendered-bitmap + golden ASCII + mocked main loop)
        run: python3 -m unittest discover -s tests -v

      # a few ASCII frames straight into the job log, no download needed
      - name: ascii preview in the log
        run: python3 sim/sim.py print --screen weather --code 61 --temp 21 --frames 4

      - name: render before/after GIFs (base vs PR head)
        # screens the base ref cannot render are skipped with a note (after-only)
        run: python3 sim/before_after.py --ref "${{ github.event.pull_request.base.sha }}" --out /tmp/pr

      - uses: actions/upload-artifact@v4
        with:
          name: sim-before-after
          path: /tmp/pr_*.gif
          retention-days: 14
          if-no-files-found: ignore  # docs-only PRs change no screens -> no GIFs

      # Upload the *_compare.gif files as assets of a hidden prerelease via the
      # gh CLI (reference implementation of the upload protocol), then comment
      # on the PR with inline ![...](browser_download_url) embeds — release
      # asset images render directly in PR comments.
      #
      # Each GIF is uploaded once, under a per-run name carrying the run id
      # (run ids are unique, so nothing is ever clobbered — every version is
      # kept). The PR comment embeds exactly this run's assets. Old copies are
      # pruned to the newest 40 (10 runs x 4 screens).
      - name: comment before/after GIFs inline on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          shopt -s nullglob  # an unmatched glob must not reach cp as a literal name
          gh release create pr-sim-assets --prerelease --title pr-sim-assets \
            --notes 'hidden asset store for pr-sim inline GIFs' --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          # the tag was auto-created on the default branch (main) by the first
          # `gh release create`; retarget it to the PR base so the release's
          # auto-generated source archive is not stale main-branch code
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/pr-sim-assets" \
            -f sha="${{ github.event.pull_request.base.sha }}" -F force=true > /dev/null
          RUN_TAG="r${{ github.run_id }}"
          for f in /tmp/pr_*_compare.gif /tmp/pr_*_after.gif; do
            base=$(basename "$f")
            # after-only screens (new at this PR, no base to compare) still
            # get an embed; skip *_after.gif when a compare already covers it
            case "$base" in
              *_after.gif) [[ -f "/tmp/${base%_after.gif}_compare.gif" ]] && continue ;;
            esac
            cp "$f" "/tmp/${base%.gif}_${RUN_TAG}.gif"
            # --clobber: re-runs of the same run id must not fail on existing assets
            gh release upload pr-sim-assets "/tmp/${base%.gif}_${RUN_TAG}.gif" --clobber --repo "$GITHUB_REPOSITORY"
          done
          # prune archived copies: keep the newest 40 (run ids sort numerically)
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/pr-sim-assets" \
            --jq '[.assets[] | select(.name | test("_r[0-9]+\\.gif$")) | {id, run: (.name | capture("_r(?<r>[0-9]+)\\.gif$") | .r | tonumber)}] | sort_by(-.run) | .[40:] | .[].id' \
            | while read -r aid; do
                [ -n "$aid" ] || continue
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > /dev/null
              done
          {
            echo "Sim before/after (base \`${{ github.event.pull_request.base.sha }}\` vs this PR), inline:"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/pr-sim-assets" \
              --jq '.assets[] | select(.name | test("_r${{ github.run_id }}\\.gif$")) | "\n\n**\(.name)** \((if (.name | contains("compare")) then "before on top, after below" else "new at this PR — after only" end))\n\n![\(.name)](\(.browser_download_url))"'
            echo
            echo "All per-screen before/after files are also in the \`sim-before-after\` artifact of [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). These per-run GIFs (\`*_r<run_id>.gif\`, newest 40 kept) are archived on the [pr-sim-assets release](${{ github.server_url }}/${{ github.repository }}/releases/tag/pr-sim-assets). ASCII frames for one screen are in the job log above."
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
